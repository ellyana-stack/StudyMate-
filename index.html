
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate - Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

 <body class="login-page"></body>

    <div class="login-container">

        <!-- Logo and Website Name -->
        <div class="brand">

            <div class="brand-row">

                <!-- Graduation Cap Logo -->
                <div class="logo">
                    <svg viewBox="0 0 100 100" width="90" height="90">

                        <path d="M5 35 L50 12 L95 35 L50 58 Z"
                              fill="#7541A5"/>

                        <path d="M23 46 L23 67 Q50 88 77 67 L77 46 L50 60 Z"
                              fill="#A879CC"/>

                        <path d="M88 39 L88 70"
                              stroke="#7541A5" stroke-width="4"/>

                        <circle cx="88" cy="74" r="5"
                                fill="#7541A5"/>

                    </svg>
                </div>

                <!-- Website Name -->
                <div class="brand-text">

                    <h1>StudyMate</h1>

                    <p class="slogan">
                        Your Study, Your Progress.
                    </p>

                </div>

            </div>

        </div>


        <!-- Login Form -->
        <div class="login-box">

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Please login to continue
            </p>

            <form id="loginForm">

                <!-- Username -->
                <div class="mb-3 text-start">

                    <label class="form-label">
                        Username
                    </label>

                    <input type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        value="ellyantsha"
                        required>

                </div>


                <!-- Password -->
                <div class="mb-3 text-start">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        value="12345"
                        required>

                </div>


                <!-- Error Message -->
                <p id="errorMessage" class="text-danger"></p>


                <!-- Login Button -->
                <button type="submit" class="btn login-btn w-100">

                    ↪ Login

                </button>

            </form>


            <!-- Footer -->
            <div class="footer">

                StudyMate © 2026

            </div>

        </div>

    </div>


    <!-- Login Function -->
    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let username = document.getElementById("username").value;

            let password = document.getElementById("password").value;

            let errorMessage = document.getElementById("errorMessage");


            if (username === "ellyantsha" && password === "12345") {

                window.location.href = "dashboard.html";

            } else {

                errorMessage.textContent =
                    "Invalid username or password!";

            }

        });

    </script>

</body>
</html>
